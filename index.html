<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gowri Shankar — AI Product Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-alt: #f7f7f8;
      --bg-card: #ffffff;
      --border: #e6e6e8;
      --border-subtle: #f0f0f2;
      --text: #111113;
      --text-muted: #5d5d66;
      --text-faint: #8e8e99;
      --accent: #111113;
      --accent-tint: #f0f0f4;
      --tag-bg: #f2f2f5;
      --tag-text: #333338;
      --badge-pub-bg: #e6f4ea;
      --badge-pub-text: #137333;
      --badge-port-bg: #e8f0fe;
      --badge-port-text: #1a73e8;
      --badge-priv-bg: #fce8e6;
      --badge-priv-text: #c5221f;
      --font-sans: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-serif: 'Lora', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --container-max: 1120px;
      --radius: 10px;
    }

    [data-theme="dark"] {
      --bg: #0d0d0f;
      --bg-alt: #141418;
      --bg-card: #18181d;
      --border: #26262e;
      --border-subtle: #1c1c22;
      --text: #f0f0f4;
      --text-muted: #a0a0ab;
      --text-faint: #6c6c77;
      --accent: #f0f0f4;
      --accent-tint: #202028;
      --tag-bg: #22222b;
      --tag-text: #d0d0d9;
      --badge-pub-bg: #0f2e1b;
      --badge-pub-text: #5bb974;
      --badge-port-bg: #142845;
      --badge-port-text: #8ab4f8;
      --badge-priv-bg: #371413;
      --badge-priv-text: #f28b82;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    .container {
      max-width: var(--container-max);
      margin: 0 auto;
      padding: 0 24px;
    }

    /* TOP NAVBAR */
    .navbar {
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      background: var(--bg);
      backdrop-filter: blur(12px);
      z-index: 99;
      transition: background-color 0.2s;
    }

    .navbar-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 64px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-badge {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      padding: 3px 8px;
      background: var(--accent-tint);
      color: var(--text-muted);
      border-radius: 4px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      padding: 8px 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      border-radius: 6px;
      transition: all 0.15s ease;
    }

    .nav-btn:hover {
      color: var(--text);
      background: var(--bg-alt);
    }

    .nav-btn.active {
      color: var(--text);
      background: var(--accent-tint);
      font-weight: 600;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .theme-toggle {
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .theme-toggle:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }

    /* LENS SELECTOR BANNER */
    .lens-banner {
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 14px 0;
    }

    .lens-inner {
      display: flex;
      align-items: center;
      gap: 16px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .lens-inner::-webkit-scrollbar {
      display: none;
    }

    .lens-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      font-weight: 600;
      white-space: nowrap;
    }

    .lens-tabs {
      display: flex;
      gap: 6px;
    }

    .lens-tab {
      padding: 6px 12px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 20px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      white-space: nowrap;
      transition: all 0.15s;
    }

    .lens-tab:hover {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .lens-tab.active {
      background: var(--accent);
      color: var(--bg);
      border-color: var(--accent);
      font-weight: 600;
    }

    /* LENS EXPLANATION CARD */
    .lens-explainer {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      padding: 14px 20px;
      border-radius: 0 var(--radius) var(--radius) 0;
      margin: 24px 0 32px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
    }

    .lens-explainer-text strong {
      color: var(--text);
    }

    .lens-explainer-text span {
      color: var(--text-muted);
      margin-left: 8px;
    }

    /* HERO SECTION */
    .hero {
      padding: 56px 0 40px 0;
      border-bottom: 1px solid var(--border);
    }

    .hero-meta {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .hero-name {
      font-family: var(--font-serif);
      font-size: 44px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero-statement {
      font-size: 22px;
      font-family: var(--font-serif);
      font-style: italic;
      color: var(--text-muted);
      line-height: 1.4;
      max-width: 760px;
      margin-bottom: 28px;
    }

    .hero-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }

    .hero-item-title {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 6px;
    }

    .hero-item-content {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .hero-item-content strong {
      color: var(--text);
    }

    /* SECTION TITLE */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin: 48px 0 24px 0;
    }

    .section-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .section-subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* PROJECT CARDS */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
      margin-bottom: 64px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0,0,0,0.06);
      border-color: var(--accent);
    }

    .project-image-box {
      height: 220px;
      background: var(--bg-alt);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
      position: relative;
    }

    .project-image-box img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 16px;
      transition: transform 0.3s;
    }

    .project-card:hover .project-image-box img {
      transform: scale(1.03);
    }

    .project-badge-num {
      position: absolute;
      top: 14px;
      left: 14px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 4px;
      backdrop-filter: blur(4px);
    }

    .project-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .project-header-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    .project-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
    }

    .project-period {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-faint);
    }

    .project-tagline {
      font-size: 13px;
      color: var(--text-faint);
      font-weight: 500;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .project-summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 18px;
      flex: 1;
    }

    .project-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .tag {
      font-size: 11.5px;
      padding: 3px 8px;
      background: var(--tag-bg);
      color: var(--tag-text);
      border-radius: 4px;
      font-weight: 500;
    }

    .project-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid var(--border-subtle);
    }

    .project-link-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .project-link-btn:hover {
      text-decoration: underline;
    }

    /* GROUNDED PRINCIPLES STRIP */
    .principles-section {
      background: var(--bg-alt);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 32px;
      margin: 40px 0 64px 0;
    }

    .principles-title {
      font-family: var(--font-serif);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .principles-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .principle-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
    }

    .principle-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 15px;
      color: var(--text);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .principle-source {
      font-size: 12px;
      color: var(--text-faint);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* CASE STUDY STYLING */
    .case-study-hero {
      padding: 48px 0 32px 0;
      border-bottom: 1px solid var(--border);
    }

    .cs-label {
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-faint);
      margin-bottom: 12px;
    }

    .cs-title {
      font-family: var(--font-serif);
      font-size: 38px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 16px;
    }

    .cs-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 800px;
      line-height: 1.5;
      margin-bottom: 32px;
    }

    .cs-spec-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 20px;
      background: var(--bg-alt);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 32px;
    }

    .cs-spec-item {
      font-size: 13px;
    }

    .cs-spec-label {
      font-size: 11px;
      color: var(--text-faint);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .cs-spec-val {
      font-weight: 600;
      color: var(--text);
    }

    .story-list {
      display: flex;
      flex-direction: column;
      gap: 40px;
      margin: 48px 0;
    }

    .story-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .story-header {
      padding: 24px 32px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bg-alt);
    }

    .story-num-title {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .story-index {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-faint);
    }

    .story-title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 600;
    }

    .story-category-tag {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 4px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 20px;
    }

    .story-body {
      padding: 32px;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 36px;
    }

    .story-narrative {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .story-block h4 {
      font-size: 11.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-faint);
      margin-bottom: 6px;
    }

    .story-block p {
      font-size: 14.5px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .story-sidebar {
      background: var(--bg-alt);
      border-radius: 8px;
      padding: 24px;
      border: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .takeaway-quote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 16px;
      color: var(--text);
      line-height: 1.4;
      border-left: 3px solid var(--accent);
      padding-left: 14px;
    }

    .story-evidence-pill {
      font-size: 12.5px;
      padding: 10px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      line-height: 1.4;
    }

    .story-evidence-pill strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin-bottom: 2px;
    }

    /* BUILDER LOG & DATABASE VIEW */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 24px 0;
      align-items: center;
      background: var(--bg-alt);
      padding: 16px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }

    .search-input {
      flex: 1;
      min-width: 220px;
      padding: 9px 14px;
      font-size: 13.5px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    .filter-select {
      padding: 9px 14px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--text);
    }

    .visibility-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .visibility-toggle input {
      cursor: pointer;
    }

    /* LOG ENTRY TABLE / LIST */
    .log-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 64px;
    }

    .log-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .log-card:hover {
      border-color: var(--text-muted);
      box-shadow: 0 4px 16px rgba(0,0,0,0.03);
    }

    .log-top-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .log-meta-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .log-date {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-faint);
    }

    .log-project-pill {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 2px 7px;
      border-radius: 4px;
      background: var(--accent-tint);
      color: var(--text);
    }

    .badge-vis {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .badge-public { background: var(--badge-pub-bg); color: var(--badge-pub-text); }
    .badge-portfolio { background: var(--badge-port-bg); color: var(--badge-port-text); }
    .badge-private { background: var(--badge-priv-bg); color: var(--badge-priv-text); }

    .log-title {
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .log-takeaway-bar {
      background: var(--bg-alt);
      border-left: 3px solid var(--accent);
      padding: 8px 14px;
      font-size: 13.5px;
      font-style: italic;
      color: var(--text);
      margin: 12px 0 16px 0;
      border-radius: 0 4px 4px 0;
    }

    .log-details-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      font-size: 13px;
      margin-bottom: 16px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .log-detail-col strong {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-faint);
      margin-bottom: 4px;
    }

    .log-detail-col p {
      color: var(--text-muted);
      line-height: 1.5;
    }

    .log-action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    .btn-text {
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .btn-text:hover {
      text-decoration: underline;
    }

    /* MODAL FOR DEEP INSPECTION */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .modal-content {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      max-width: 840px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 32px;
      box-shadow: 0 24px 48px rgba(0,0,0,0.2);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    .modal-title {
      font-family: var(--font-serif);
      font-size: 24px;
      font-weight: 600;
    }

    .modal-close-btn {
      font-size: 20px;
      color: var(--text-faint);
      padding: 4px;
    }

    .modal-close-btn:hover {
      color: var(--text);

                <div class="log-detail-col">
                  <strong>Principle / Learning</strong>
                  <p>${log.principle}</p>
                </div>
              </div>

              <div class="log-action-bar">
                <div class="project-tags">
                  ${log.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                </div>
                <button class="btn-text" onclick="openModal('${log.id}')">Inspect Full Problem-Solving Record →</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // MASTER BUILDER DATABASE (ALL PROJECTS)
    function renderDatabase() {
      const logs = state.database.filter(item => {
        const matchesProj = state.filterProject === 'ALL' || item.project === state.filterProject;
        const matchesCat = state.filterCategory === 'ALL' || item.category === state.filterCategory;
        const matchesSearch = !state.searchQuery || 
          item.title.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
          item.problem.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
          item.action.toLowerCase().includes(state.searchQuery.toLowerCase()) ||
          (item.tags && item.tags.some(t => t.toLowerCase().includes(state.searchQuery.toLowerCase())));
        const matchesVis = state.showPrivate || item.visibility !== 'PRIVATE';
        return matchesProj && matchesCat && matchesSearch && matchesVis;
      });

      return `
        <div class="section-header" style="margin-top: 24px;">
          <div>
            <h1 class="section-title">Master Builder Database</h1>
            <div class="section-subtitle">The single source of truth across Cheeko, Insol, Science Experience Centre, Onstrays, and Systems.</div>
          </div>
          <span style="font-family: var(--font-mono); font-size: 13px; color: var(--text-faint);">
            ${logs.length} Total Verified Entries
          </span>
        </div>

        <div class="filter-bar">
          <input 
            type="text" 
            class="search-input" 
            placeholder="Search across all projects, technical depths, tags..." 
            value="${state.searchQuery}"
            oninput="state.searchQuery = this.value; render();"
          >

          <select class="filter-select" onchange="state.filterProject = this.value; render();">
            <option value="ALL">All Projects</option>
            <option value="Cheeko" ${state.filterProject === 'Cheeko' ? 'selected' : ''}>Cheeko (Hardware AI)</option>
            <option value="Insol" ${state.filterProject === 'Insol' ? 'selected' : ''}>Insol (Voice AI)</option>
            <option value="Science Experience Centre" ${state.filterProject === 'Science Experience Centre' ? 'selected' : ''}>Science Experience Centre</option>
            <option value="Onstrays" ${state.filterProject === 'Onstrays' ? 'selected' : ''}>Onstrays & Systems</option>
          </select>

          <select class="filter-select" onchange="state.filterCategory = this.value; render();">
            <option value="ALL">All Categories</option>
            <option value="Product">Product</option>
            <option value="AI">AI & Systems</option>
            <option value="Hardware">Hardware</option>
            <option value="Manufacturing">Manufacturing</option>
            <option value="UX">UX & Research</option>
            <option value="Industrial Design">Industrial Design</option>
            <option value="Packaging">Packaging</option>
            <option value="Operations">Operations</option>
          </select>

          <label class="visibility-toggle">
            <input 
              type="checkbox" 
              ${state.showPrivate ? 'checked' : ''} 
              onchange="state.showPrivate = this.checked; render();"
            >
            Show Private
          </label>
        </div>

        <div class="log-list">
          ${logs.map(log => `
            <div class="log-card">
              <div class="log-top-row">
                <div class="log-meta-left">
                  <span class="log-date">${log.date}</span>
                  <span class="log-project-pill">${log.project}</span>
                  <span class="tag">${log.category}</span>
                </div>
                <span class="badge-vis ${log.visibility === 'PUBLIC' ? 'badge-public' : log.visibility === 'PORTFOLIO' ? 'badge-portfolio' : 'badge-private'}">
                  ${log.visibility}
                </span>
              </div>

              <h3 class="log-title">${log.title}</h3>
              
              <div class="log-takeaway-bar">
                "${log.one_line_takeaway || log.principle}"
              </div>

              <div class="log-details-grid">
                <div class="log-detail-col">
                  <strong>Problem Encountered</strong>
                  <p>${log.problem}</p>
                </div>
                <div class="log-detail-col">
                  <strong>Action Taken</strong>
                  <p>${log.action}</p>
                </div>
                <div class="log-detail-col">
                  <strong>Principle / Learning</strong>
                  <p>${log.principle}</p>
                </div>
              </div>

              <div class="log-action-bar">
                <div class="project-tags">
                  ${log.tags.map(t => `<span class="tag">#${t}</span>`).join('')}
                </div>
                <button class="btn-text" onclick="openModal('${log.id}')">Inspect Full Problem-Solving Record →</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    // MODAL
    function openModal(id) {
      state.selectedLog = state.database.find(e => e.id === id);
      render();
    }

    function closeModal() {
      state.selectedLog = null;
      render();
    }

    function renderModal() {
      if (!state.selectedLog) return '';
      const log = state.selectedLog;
      return `
        <div class="modal-backdrop" onclick="closeModal()">
          <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
              <div>
                <div style="font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); margin-bottom: 4px;">
                  ${log.date} · ${log.project} · ${log.category}
                </div>
                <h2 class="modal-title">${log.title}</h2>
              </div>
              <button class="modal-close-btn" onclick="closeModal()">✕</button>
            </div>

            <div class="log-takeaway-bar" style="margin-bottom: 24px; font-size: 15px;">
              "${log.one_line_takeaway || log.principle}"
            </div>

            <div class="problem-solving-breakdown">
              <div class="ps-block">
                <div class="ps-label">01. Problem</div>
                <div class="ps-content">${log.problem}</div>
              </div>

              <div class="ps-block">
                <div class="ps-label">02. Context (Why it mattered)</div>
                <div class="ps-content">${log.context}</div>
              </div>

              <div class="ps-block">
                <div class="ps-label">03. Investigation</div>
                <div class="ps-content">${log.investigation}</div>
              </div>

              <div class="ps-block">
                <div class="ps-label">04. People & Collaboration</div>
                <div class="ps-content">${log.people} (Role: ${log.my_role})</div>
              </div>

              ${log.hypotheses ? `
                <div class="ps-block">
                  <div class="ps-label">05. Hypotheses Tested</div>
                  <div class="ps-content">
                    <ul style="padding-left: 18px;">
                      ${log.hypotheses.map(h => `<li>${h}</li>`).join('')}
                    </ul>
                  </div>
                </div>
              ` : ''}

              <div class="ps-block">
                <div class="ps-label">06. Experiment & Action (What I / We Did)</div>
                <div class="ps-content">${log.action}</div>
              </div>

              <div class="ps-block">
                <div class="ps-label">07. Observable Result</div>
                <div class="ps-content">${log.result}</div>
              </div>

              <div class="ps-block">
                <div class="ps-label">08. Core Principle Learned</div>
                <div class="ps-content"><strong>${log.principle}</strong></div>
              </div>

              ${log.next_time ? `
                <div class="ps-block">
                  <div class="ps-label">09. Next Time (What I'd do differently)</div>
                  <div class="ps-content">${log.next_time}</div>
                </div>
              ` : ''}

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px;">
                <div class="ps-block">
                  <div class="ps-label">Technical Depth</div>
                  <div class="ps-content" style="font-size: 13.5px;">${log.technical_depth || 'N/A'}</div>
                </div>
                <div class="ps-block">
                  <div class="ps-label">Product Thinking</div>
                  <div class="ps-content" style="font-size: 13.5px;">${log.product_thinking || 'N/A'}</div>
                </div>
              </div>
            </div>

            <div style="margin-top: 24px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border); padding-top: 16px;">
              <span style="font-size: 12px; color: var(--text-faint);">
                Confidentiality Level: <strong>${log.confidentiality_level}</strong>
              </span>
              <button class="lens-tab" onclick="navigator.clipboard.writeText('${(log.one_line_takeaway || log.principle).replace(/'/g, "\\'")}'); alert('One-line takeaway copied to clipboard!');">
                Copy One-Line Takeaway
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderFooter() {
      return `
        <footer class="footer">
          <div class="container footer-inner">
            <div>
              <strong>Gowri Shankar</strong> — AI Product Builder<br>
              <span style="font-size: 12.5px; color: var(--text-faint);">
                Personal Product Development Memory · One Source of Truth
              </span>
            </div>
            <div style="text-align: right; font-size: 12.5px;">
              Bangalore, India · <a href="mailto:iamgowrishankar05@gmail.com" style="text-decoration: underline;">iamgowrishankar05@gmail.com</a>
            </div>
          </div>
        </footer>
      `;
    }

    function render() {
      let pageContent = '';
      if (state.currentPage === 'home') {
        pageContent = renderHome();
      } else if (state.currentPage === 'cheeko') {
        pageContent = renderCheekoCaseStudy();
      } else if (state.currentPage === 'logs') {
        pageContent = renderLogs();
      } else if (state.currentPage === 'database') {
        pageContent = renderDatabase();
      }

      document.getElementById('app').innerHTML = `
        ${renderNavbar()}
        ${renderLensBanner()}
        <main class="container">
          ${pageContent}
        </main>
        ${renderModal()}
        ${renderFooter()}
      `;
    }

    // Initialize
    loadData();
  </script>
</body>
</html>
