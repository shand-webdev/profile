<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gowrishankar — AI Product Builder</title>
  <meta name="description" content="I build products across AI, software, hardware, and the physical world.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f9f9fb;
      --bg-hover: #f2f2f5;
      --border: #e8e8ed;
      --border-subtle: #f0f0f4;
      --text: #111113;
      --text-secondary: #585864;
      --text-muted: #8c8c98;
      --sidebar-width: 250px;
      --header-height: 58px;
      --font-serif: 'Newsreader', Georgia, serif;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    [data-theme="dark"] {
      --bg: #0c0c0e;
      --bg-subtle: #141418;
      --bg-hover: #1a1a20;
      --border: #222228;
      --border-subtle: #1a1a20;
      --text: #eeeeef;
      --text-secondary: #9c9ca6;
      --text-muted: #62626e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      font-size: 15px;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
    }

    /* TOP STABLE HEADER */
    .top-header {
      position: sticky;
      top: 0;
      height: var(--header-height);
      background: var(--bg);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 100;
      backdrop-filter: blur(10px);
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100%;
      padding: 0 32px;
    }

    .brand-block {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-subtitle {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .header-nav {
      display: flex;
      align-items: center;
      gap: 20px;
      font-size: 13.5px;
    }

    .header-nav a {
      color: var(--text-secondary);
      transition: color 0.15s;
    }

    .header-nav a:hover, .header-nav a.active {
      color: var(--text);
    }

    .theme-toggle-btn {
      font-size: 12.5px;
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.15s;
    }

    .theme-toggle-btn:hover {
      color: var(--text);
      background: var(--bg-subtle);
    }

    .mobile-menu-btn {
      display: none;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 4px;
    }

    /* WORKSPACE LAYOUT (SIDEBAR + MAIN) */
    .workspace {
      display: flex;
      min-height: calc(100vh - var(--header-height));
    }

    /* LEFT SIDEBAR */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      border-right: 1px solid var(--border-subtle);
      padding: 32px 20px 48px 32px;
      position: sticky;
      top: var(--header-height);
      height: calc(100vh - var(--header-height));
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .sidebar-section {
      margin-bottom: 28px;
    }

    .sidebar-heading {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      margin-bottom: 10px;
      padding-left: 8px;
      font-weight: 500;
    }

    .sidebar-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sidebar-item a {
      display: block;
      padding: 6px 10px;
      font-size: 13.5px;
      color: var(--text-secondary);
      border-radius: 5px;
      transition: all 0.12s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item a:hover {
      color: var(--text);
      background: var(--bg-hover);
    }

    .sidebar-item a.active {
      color: var(--text);
      background: var(--bg-hover);
      font-weight: 500;
    }

    /* MAIN CONTENT AREA */
    .main-viewport {
      flex: 1;
      padding: 48px 56px 80px 56px;
      max-width: 920px;
    }

    /* HERO */
    .hero-wrap {
      margin-bottom: 56px;
    }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: 36px;
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: -0.015em;
      margin-bottom: 20px;
      color: var(--text);
    }

    .hero-desc {
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-secondary);
      max-width: 680px;
    }

    /* PANE HEADER */
    .pane-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
      margin: 40px 0 24px 0;
    }

    .pane-title {
      font-family: var(--font-mono);
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-muted);
      font-weight: 500;
    }

    .pane-subtitle {
      font-size: 12.5px;
      color: var(--text-muted);
      font-style: italic;
      margin-left: 8px;
    }

    .pane-link {
      font-size: 13px;
      color: var(--text-secondary);
    }

    .pane-link:hover {
      color: var(--text);
    }

    /* PROMINENT CHEEKO CARD */
    .featured-project-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 32px;
      align-items: center;
      margin-bottom: 40px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .featured-project-box:hover {
      border-color: var(--text-secondary);
      box-shadow: 0 12px 32px rgba(0,0,0,0.04);
    }

    .featured-tagline {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .featured-heading {
      font-family: var(--font-serif);
      font-size: 30px;
      line-height: 1.25;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .featured-p {
      font-size: 15px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .featured-action-link {
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
    }

    .featured-visual {
      height: 220px;
      background: var(--bg);
      border-radius: 6px;
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .featured-visual img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* PROJECTS GRID */
    .secondary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 48px;
    }

    .compact-project-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 210px;
      transition: border-color 0.15s, transform 0.15s;
    }

    .compact-project-card:hover {
      border-color: var(--text-secondary);
      transform: translateY(-2px);
    }

    .compact-tag {
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .compact-name {
      font-family: var(--font-serif);
      font-size: 19px;
      line-height: 1.25;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .compact-desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .compact-footer {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    /* NOTES LIST */
    .notes-table {
      display: flex;
      flex-direction: column;
      gap: 0;
      margin-bottom: 48px;
    }

    .notes-table-row {
      padding: 18px 0;
      border-bottom: 1px solid var(--border-subtle);
      display: grid;
      grid-template-columns: 120px 1fr 30px;
      gap: 16px;
      align-items: baseline;
      transition: opacity 0.15s;
    }

    .notes-table-row:hover {
      opacity: 0.75;
    }

    .note-row-date {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .note-row-title {
      font-family: var(--font-serif);
      font-size: 18px;
      line-height: 1.35;
      font-weight: 500;
      margin-bottom: 4px;
      color: var(--text);
    }

    .note-row-summary {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .note-row-arrow {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
    }

    /* STUDIO GRID (CREATE) */
    .studio-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px;
      margin-bottom: 48px;
    }

    .studio-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s, transform 0.15s;
    }

    .studio-card:hover {
      border-color: var(--text-secondary);
      transform: translateY(-2px);
    }

    .studio-card-img-wrap {
      width: 100%;
      height: 240px;
      background: var(--bg-subtle);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--border-subtle);
    }

    .studio-card-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .studio-card:hover .studio-card-img-wrap img {
      transform: scale(1.02);
    }

    .studio-card-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .studio-card-meta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    .studio-card-title {
      font-family: var(--font-serif);
      font-size: 20px;
      line-height: 1.3;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .studio-card-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 16px;
    }

    .studio-related-tag {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      border-top: 1px solid var(--border-subtle);
      padding-top: 10px;
    }

    .studio-related-tag span {
      color: var(--text);
    }

    /* PROJECT VIEW */
    .project-header-view {
      padding-bottom: 32px;
      border-bottom: 1px solid var(--border-subtle);
      margin-bottom: 32px;
    }

    .project-hero-title {
      font-family: var(--font-serif);
      font-size: 34px;
      line-height: 1.25;
      font-weight: 400;
      margin: 8px 0 16px 0;
    }

    .project-hero-lead {
      font-size: 16px;
      color: var(--text-secondary);
      line-height: 1.65;
      max-width: 720px;
      margin-bottom: 24px;
    }

    .project-links-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .project-ext-link {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      transition: all 0.15s;
    }

    .project-ext-link:hover {
      color: var(--text);
      border-color: var(--text);
    }

    .specs-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      padding: 18px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .specs-col {
      font-size: 12.5px;
    }

    .specs-col-label {
      font-family: var(--font-mono);
      font-size: 10.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .specs-col-val {
      font-weight: 500;
      color: var(--text);
    }

    .project-narrative-block {
      margin-bottom: 28px;
    }

    .project-narrative-title {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .project-narrative-text {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
    }

    /* BUILD NOTES LIST */
    .build-notes-feed {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: 24px;
    }

    .build-note-card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 180px;
      gap: 24px;
      align-items: center;
      transition: border-color 0.15s, transform 0.15s;
    }

    .build-note-card:hover {
      border-color: var(--text-secondary);
      transform: translateY(-2px);
    }

    .bn-meta {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .bn-title {
      font-family: var(--font-serif);
      font-size: 21px;
      line-height: 1.3;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .bn-summary {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.55;
      margin-bottom: 12px;
    }

    .bn-read-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .bn-thumb {
      width: 100%;
      height: 120px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .bn-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* READING ARTICLE / NOTE / STUDIO VIEW */
    .reading-article {
      max-width: 720px;
      padding-bottom: 64px;
    }

    .reading-back-link {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 28px;
    }

    .reading-back-link:hover {
      color: var(--text);
    }

    .reading-meta-tag {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .reading-h1 {
      font-family: var(--font-serif);
      font-size: 38px;
      line-height: 1.25;
      font-weight: 400;
      letter-spacing: -0.015em;
      margin-bottom: 24px;
    }

    .reading-visual-box {
      margin: 28px 0 36px 0;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 28px;
      text-align: center;
    }

    .reading-visual-box img {
      max-width: 100%;
      max-height: 480px;
      object-fit: contain;
    }

    .reading-caption {
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 12px;
    }

    .reading-images-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin: 32px 0 36px 0;
    }

    .reading-images-gallery img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
    }

    .reading-block {
      margin-bottom: 28px;
    }

    .reading-block-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    .reading-block-text {
      font-size: 16px;
      line-height: 1.75;
      color: var(--text);
    }

    .reading-block-text h2 {
      font-family: var(--font-serif);
      font-size: 24px;
      line-height: 1.35;
      font-weight: 500;
      margin: 32px 0 12px 0;
      color: var(--text);
    }

    .reading-block-text ul {
      padding-left: 20px;
      margin-bottom: 18px;
    }

    .reading-block-text li {
      margin-bottom: 6px;
    }

    .reading-pullquote {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 20px;
      line-height: 1.45;
      color: var(--text);
      border-left: 2px solid var(--text);
      padding-left: 18px;
      margin: 36px 0;
    }

    .cross-reference-box {
      margin-top: 40px;
      padding: 16px 20px;
      background: var(--bg-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
    }

    .cross-reference-label {
      font-family: var(--font-mono);
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .cross-reference-link {
      font-weight: 500;
      color: var(--text);
      border-bottom: 1px solid var(--text);
      padding-bottom: 1px;
    }

    /* ABOUT VIEW */
    .about-view {
      max-width: 780px;
      padding-bottom: 64px;
    }

    .about-lead-quote {
      font-family: var(--font-serif);
      font-size: 28px;
      line-height: 1.35;
      font-weight: 400;
      margin-bottom: 32px;
    }

    .about-grid-layout {
      display: grid;
      grid-template-columns: 1.25fr 1fr;
      gap: 40px;
      align-items: start;
      margin-bottom: 40px;
    }

    .about-p {
      font-size: 15.5px;
      line-height: 1.75;
      color: var(--text-secondary);
      margin-bottom: 18px;
    }

    .about-p strong {
      color: var(--text);
    }

    .campus-image-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .campus-image-grid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg-subtle);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .campus-image-grid img:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08);
    }

    /* RESPONSIVE */
    @media (max-width: 860px) {
      .workspace {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: static;
        border-right: none;
        border-bottom: 1px solid var(--border-subtle);
        padding: 20px 24px;
        display: none;
      }
      .sidebar.open-mobile {
        display: block;
      }
      .mobile-menu-btn {
        display: block;
      }
      .main-viewport {
        padding: 32px 24px;
      }

      "content": "There is a photograph of me standing at the center of a public installation in a newspaper. On the surface, it looks like a moment of visibility. In reality, it represents something very different\u2014accountability.\n\nWhen the installation opened to the public, the work stopped being an idea and became a living system. There was no staging area, no controlled environment, and no way to pause the experience. Every interaction unfolded in real time, shaped by people, space, and unpredictability.\n\n## When Work Leaves the Studio\n\nPeople don\u2019t follow intended flows. They interpret, hesitate, skip steps, or engage emotionally in ways you can\u2019t fully anticipate. Designing for a public audience forced me to abandon assumptions and respond to real behavior instead of ideal users.\n\n## Systems Are Invisible Until They Fail\n\nFrom the outside, the installation appeared seamless. Inside, it was a network of dependencies\u2014physical mechanisms, digital interactions, facilitators, and environmental constraints. Small failures compound quickly in public-facing work. Recovery, clarity, and adaptability matter more than perfection.\n\n## Final Thought\n\nWhether it\u2019s a public installation, a hardware product, or an organization, if you\u2019re not willing to stand inside the system you design\u2014to face its friction, failures, and human responses\u2014then you\u2019re not truly responsible for it."

    let state = {
      theme: localStorage.getItem('theme') || 'light',
      route: { page: 'home', id: null },
      mobileMenuOpen: false,
      data: DEFAULT_DATA
    };

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', state.theme);
      localStorage.setItem('theme', state.theme);
    }
    applyTheme();

    function toggleTheme() {
      state.theme = state.theme === 'light' ? 'dark' : 'light';
      applyTheme();
      render();
    }

    function toggleMobileMenu() {
      state.mobileMenuOpen = !state.mobileMenuOpen;
      render();
    }

    // Router
    function parseRoute() {
      const hash = window.location.hash.replace(/^#\/?/, '');
      if (!hash) {
        state.route = { page: 'home', id: null };
      } else if (hash.startsWith('cheeko/')) {
        const id = hash.replace('cheeko/', '');
        state.route = { page: 'cheeko-article', id: id };
      } else if (hash === 'cheeko') {
        state.route = { page: 'cheeko', id: null };
      } else if (hash.startsWith('project/')) {
        const id = hash.replace('project/', '');
        state.route = { page: 'project', id: id };
      } else if (hash.startsWith('note/')) {
        const id = hash.replace('note/', '');
        state.route = { page: 'note-reading', id: id };
      } else if (hash === 'notes') {
        state.route = { page: 'notes', id: null };
      } else if (hash.startsWith('studio/')) {
        const id = hash.replace('studio/', '');
        state.route = { page: 'studio-item', id: id };
      } else if (hash === 'studio') {
        state.route = { page: 'studio', id: null };
      } else if (hash === 'about') {
        state.route = { page: 'about', id: null };
      } else {
        state.route = { page: 'home', id: null };
      }
    }

    window.addEventListener('hashchange', () => {
      parseRoute();
      state.mobileMenuOpen = false;
      render();
      window.scrollTo(0, 0);
    });

    async function initData() {
      try {
        const res = await fetch('data/content.json');
        if (res.ok) {
          state.data = await res.json();
        }
      } catch (e) {
        console.error('Fetch error:', e);
      }
      parseRoute();
      render();
    }

          <div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border-subtle); display: flex; justify-content: space-between;">
            <a href="#/studio" class="reading-back-link">← Back to Studio</a>
            <a href="#/cheeko" class="reading-back-link">Explore Cheeko Work →</a>
          </div>
        </article>
      `;
    }

    // 9. ABOUT VIEW
    function renderAboutView() {
      const { profile } = state.data;
      return `
        <div class="about-view">
          <div class="hero-eyebrow">Background</div>
          <h1 class="about-lead-quote">
            I’m comfortable entering unfamiliar territory, understanding the problem, working with specialists, and figuring out how to get the product built.
          </h1>

          <div class="about-grid-layout">
            <div>
              <h2 style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 12px;">Background</h2>
              <p class="about-p">
                I studied <strong>Mechanical Engineering (B.Tech + M.Tech)</strong> at <strong>IIITDM Kancheepuram</strong>, where I learned to think in systems—structure, forces, constraints, and trade-offs. That foundation shaped how I approach problems long before I worked on screens.
              </p>
              <p class="about-p">
                Over the years, I’ve worked across product, design, and technology—ranging from public installations and science experience centers to digital platforms and consumer AI hardware. My work focuses on turning abstract ideas into systems people can intuitively understand and use.
              </p>
              <p class="about-p">
                I’m especially interested in how decisions scale—how incentives, interfaces, acoustics, and mechanical constraints shape behavior at individual and system levels.
              </p>
            </div>

            <div>
              <div class="campus-image-grid">
                <img src="assets/images/iiit.jpg" alt="IIITDM Kancheepuram campus">
                <img src="assets/images/IIIT2.jpg" alt="IIITDM Kancheepuram campus">
                <img src="assets/images/IIIT3.jpg" alt="IIITDM Kancheepuram campus">
                <img src="assets/images/iiit4.jpg" alt="IIITDM Kancheepuram campus">
              </div>
              <div style="font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); text-align: center; margin-top: 8px;">
                IIITDM Kancheepuram
              </div>
            </div>
          </div>

          <div style="margin-bottom: 36px;">
            <h2 style="font-family: var(--font-serif); font-size: 22px; margin-bottom: 12px;">What I Like Working On</h2>
            <p class="about-p">
              I’m drawn to problems where clarity is missing and structure needs to be built—0→1 products, messy systems, and ideas that require both strategic framing and hands-on execution.
            </p>
            <p class="about-p">
              I enjoy work where thinking matters as much as shipping, where constraints force better decisions, and where outcomes are shaped by understanding people, physical reality, and technology.
            </p>
          </div>

          <div style="padding-top: 24px; border-top: 1px solid var(--border-subtle);">
            <div style="font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;">Get in touch</div>

              Currently in ${profile.location}. Building AI consumer hardware at Cheeko.
            </p>
            <p class="about-p">
              <a href="mailto:${profile.email}" style="font-weight: 500; text-decoration: underline;">
                ${profile.email}
              </a>

        </div>
      `;
    }

    // MAIN RENDER LOOP
    function render() {
      if (!state.data) return;
      const { page, id } = state.route;
      let centerHtml = '';

      if (page === 'home') {
        centerHtml = renderHomeView();
      } else if (page === 'cheeko') {
        centerHtml = renderCheekoView();
      } else if (page === 'project') {
        centerHtml = renderGenericProjectView(id);
      } else if (page === 'cheeko-article') {
        centerHtml = renderCheekoArticleView(id);
      } else if (page === 'notes') {
        centerHtml = renderNotesDirectoryView();
      } else if (page === 'note-reading') {
        centerHtml = renderNoteReadingView(id);
      } else if (page === 'studio') {
        centerHtml = renderStudioDirectoryView();
      } else if (page === 'studio-item') {
        centerHtml = renderStudioItemView(id);
      } else if (page === 'about') {
        centerHtml = renderAboutView();
      }

      document.getElementById('app').innerHTML = `
        ${renderTopHeader()}
        <div class="workspace">
          ${renderSidebar()}
          <main class="main-viewport">
            ${centerHtml}
          </main>
        </div>
      `;
    }

    // Start
    initData();
  </script>
</body>
</html>
